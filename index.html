  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>家族用献立ページ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-soft: #f4f6f1;
        --ink: #2b2620;
        --ink-soft: #6d6459;
        --line: #e3ddd2;
        --green: #33684a;
        --green-deep: #26513a;
        --green-tint: #e7f0e8;
        --persimmon: #bc5227;
        --persimmon-tint: #faeee7;
        --sun: #c0392b;
        --shadow: 0 2px 10px rgba(60, 48, 32, 0.08);
        --radius: 18px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #1c1916;
          --surface: #26221e;
          --surface-soft: #2c2823;
          --ink: #f3eee6;
          --ink-soft: #b8ad9e;
          --line: #453e35;
          --green: #8fc7a2;
          --green-deep: #a9d8ba;
          --green-tint: #2b3d31;
          --persimmon: #e08a5f;
          --persimmon-tint: #42322a;
          --sun: #e88a7d;
          --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        font-size: 17px;
        line-height: 1.65;
      }
      button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
      img { display: block; max-width: 100%; }
      .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 48px; }

      h1, h2, h3 { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; line-height: 1.35; margin: 0; }

      /* ---------- home ---------- */
      .today-line { font-size: 1.05rem; color: var(--ink-soft); font-weight: 500; }
      .today-big { font-size: 2rem; font-weight: 900; font-family: "Zen Maru Gothic", sans-serif; margin: 2px 0 6px; }
      .today-big .dow { font-size: 1.25rem; color: var(--green); }
      .home-lead { color: var(--ink-soft); margin: 0 0 22px; }
      .menu-cards { display: grid; gap: 16px; }
      @media (min-width: 560px) { .menu-cards { grid-template-columns: 1fr 1fr; } }
      .menu-card {
        display: flex; flex-direction: column; gap: 8px; text-align: left;
        background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
        padding: 22px 20px 20px; box-shadow: var(--shadow); min-height: 132px; width: 100%;
      }
      .menu-card:active { transform: scale(0.99); }
      .menu-card .mc-head { display: flex; align-items: center; gap: 12px; }
      .menu-card .mc-icon {
        width: 52px; height: 52px; flex: none; border-radius: 14px;
        display: grid; place-items: center;
      }
      .menu-card .mc-icon.green { background: var(--green-tint); color: var(--green); }
      .menu-card .mc-icon.persimmon { background: var(--persimmon-tint); color: var(--persimmon); }
      .menu-card .mc-title { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 1.55rem; }
      .menu-card .mc-sub { color: var(--ink-soft); font-size: 1rem; }
      .menu-card .mc-sub strong { color: var(--ink); font-weight: 700; }
      .menu-card .mc-arrow { margin-top: auto; color: var(--green); font-weight: 700; font-size: 0.98rem; }
      .snapshot-note {
        margin-top: 28px; padding: 14px 16px; background: var(--surface-soft);
        border-radius: 12px; color: var(--ink-soft); font-size: 0.95rem;
      }

      /* ---------- generic nav ---------- */
      .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .back-btn {
        display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 8px 14px 8px 8px;
        border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface);
        font-weight: 700; font-size: 1rem;
      }
      .topbar .spacer { flex: 1; }
      .day-nav { display: flex; gap: 8px; }
      .day-nav button {
        min-width: 44px; min-height: 44px; border-radius: 999px; border: 1.5px solid var(--line);
        background: var(--surface); font-weight: 700; font-size: 0.98rem; padding: 8px 12px;
      }
      .view-date { font-size: 1.7rem; font-weight: 900; }
      .view-date .dow { font-size: 1.1rem; color: var(--green); }
      .view-sub { color: var(--ink-soft); margin: 2px 0 18px; }

      /* ---------- dish cards ---------- */
      .dish-list { display: grid; gap: 14px; }
      .dish-card {
        display: flex; gap: 14px; align-items: stretch; width: 100%; text-align: left;
        background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
        padding: 12px; box-shadow: var(--shadow); min-height: 104px;
      }
      .dish-card:active { transform: scale(0.995); }
      .dish-thumb { width: 104px; height: 104px; flex: none; border-radius: 12px; overflow: hidden; position: relative; background: var(--surface-soft); }
      .dish-thumb img { width: 100%; height: 100%; object-fit: cover; }
      .dish-thumb .noimg {
        width: 100%; height: 100%; display: grid; place-items: center;
        font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 1.9rem; color: var(--green);
        background: var(--green-tint);
      }
      .illus-badge {
        position: absolute; right: 6px; bottom: 6px; background: rgba(30, 26, 22, 0.72); color: #fff;
        font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; line-height: 1.4;
      }
      .dish-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 2px 2px 2px 0; }
      .role-badge {
        align-self: flex-start; font-size: 0.82rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; line-height: 1.5;
      }
      .role-main { background: var(--persimmon-tint); color: var(--persimmon); }
      .role-side { background: var(--green-tint); color: var(--green); }
      .role-rice { background: var(--surface-soft); color: var(--ink-soft); }
      .dish-name { font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 1.28rem; line-height: 1.4; }
      .dish-more { color: var(--green); font-weight: 700; font-size: 0.92rem; }
      .dish-card.static { cursor: default; }
      .menu-note {
        margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--surface-soft);
        color: var(--ink-soft); font-size: 0.97rem;
      }
      .menu-note strong { color: var(--ink); }
      .empty-box {
        text-align: center; padding: 40px 20px; border: 1.5px dashed var(--line); border-radius: var(--radius);
        color: var(--ink-soft);
      }
      .empty-box .big { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 1.3rem; color: var(--ink); margin-bottom: 6px; }
      .primary-btn {
        display: inline-block; margin-top: 16px; min-height: 48px; padding: 10px 22px; border-radius: 999px;
        background: var(--green); color: #fff; font-weight: 700; font-size: 1.02rem;
      }
      @media (prefers-color-scheme: dark) { .primary-btn { color: #14231a; } }
      .recent-head { margin: 30px 0 12px; font-size: 1.25rem; font-weight: 900; }
      .recent-head span { color: var(--ink-soft); font-family: "Noto Sans JP", sans-serif; font-weight: 500; font-size: 0.95rem; margin-left: 8px; }

      /* ---------- calendar ---------- */
      .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .cal-title { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 1.5rem; }
      .cal-nav { display: flex; gap: 8px; }
      .cal-nav button {
        min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line);
        background: var(--surface); font-weight: 700;
      }
      .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
      .cal-dow { text-align: center; font-weight: 700; font-size: 0.9rem; color: var(--ink-soft); padding: 4px 0; }
      .cal-dow.sun { color: var(--sun); }
      .cal-dow.sat { color: #3a6ea8; }
      @media (prefers-color-scheme: dark) { .cal-dow.sat { color: #8fb6dd; } }
      .cal-cell {
        min-height: 74px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
        padding: 5px 6px; text-align: left; display: flex; flex-direction: column; gap: 2px; width: 100%;
      }
      .cal-cell.blank { border: none; background: transparent; min-height: 0; }
      .cal-cell .dnum { font-weight: 700; font-size: 0.98rem; line-height: 1.3; }
      .cal-cell .dmain {
        font-size: 0.68rem; line-height: 1.35; color: var(--ink-soft); font-weight: 500;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      .cal-cell.has-menu { border-color: var(--green); }
      .cal-cell.has-menu .dmain { color: var(--ink); }
      .cal-cell.is-today { background: var(--green-tint); border-color: var(--green); box-shadow: inset 0 0 0 1.5px var(--green); }
      .cal-cell .today-tag { font-size: 0.66rem; font-weight: 700; color: var(--green); }
      .cal-list-head { margin: 26px 0 10px; font-size: 1.2rem; font-weight: 900; }
      .cal-day-row {
        display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 56px;
        padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface);
        margin-bottom: 10px; box-shadow: var(--shadow);
      }
      .cal-day-row .rdate { font-weight: 900; font-family: "Zen Maru Gothic", sans-serif; white-space: nowrap; }
      .cal-day-row .rmain { color: var(--ink-soft); min-width: 0; }
      .cal-day-row .rmain strong { color: var(--ink); }

      /* ---------- recipe ---------- */
      .recipe-hero { border-radius: var(--radius); overflow: hidden; position: relative; margin-bottom: 18px; box-shadow: var(--shadow); }
      .recipe-hero img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
      .recipe-title { font-size: 1.65rem; font-weight: 900; margin: 4px 0 8px; }
      .recipe-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
      .history-chip {
        display: inline-flex; align-items: center; min-height: 40px; padding: 6px 14px; border-radius: 999px;
        border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 0.95rem;
      }
      .sec-head { font-size: 1.3rem; font-weight: 900; margin: 26px 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--green-tint); }
      table.ingredients { width: 100%; border-collapse: collapse; }
      table.ingredients td { padding: 9px 6px; border-bottom: 1px solid var(--line); font-size: 1.05rem; }
      table.ingredients td.amount { text-align: right; white-space: nowrap; font-weight: 500; padding-left: 16px; }
      ol.steps { margin: 0; padding-left: 1.6em; display: grid; gap: 12px; }
      ol.steps li { font-size: 1.05rem; padding-left: 4px; }
      ol.steps li::marker { font-weight: 900; color: var(--green); }
      .pending-box { padding: 18px; border-radius: 12px; background: var(--surface-soft); color: var(--ink-soft); }
      .source-line { margin-top: 26px; color: var(--ink-soft); font-size: 0.97rem; }
      .source-line a { color: var(--green); font-weight: 700; display: inline-block; padding: 6px 0; }
      :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; border-radius: 8px; }
    
      a.dish-card { text-decoration: none; color: inherit; cursor: pointer; }
      a.back-btn, a.history-chip { text-decoration: none; color: inherit; cursor: pointer; }
    </style>

      /* ===== 日付ユーティリティ（日本時間） ===== */
      var DOW = ["日", "月", "火", "水", "木", "金", "土"];
      function pad(n) { return (n < 10 ? "0" : "") + n; }
      function keyOf(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }
      function parseKey(k) { var p = k.split("-"); return { y: +p[0], m: +p[1], d: +p[2] }; }
      function todayKey() {
        var parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
        var o = {};
        parts.forEach(function (p) { o[p.type] = p.value; });
        return o.year + "-" + o.month + "-" + o.day;
      }
      function dowOf(k) { var p = parseKey(k); return new Date(p.y, p.m - 1, p.d).getDay(); }
      function shiftKey(k, delta) {
        var p = parseKey(k);
        var dt = new Date(p.y, p.m - 1, p.d + delta);
        return keyOf(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
      }
      function fmtDate(k) { var p = parseKey(k); return p.m + "月" + p.d + "日（" + DOW[dowOf(k)] + "）"; }
      function fmtDateFull(k) { var p = parseKey(k); return p.y + "年" + p.m + "月" + p.d + "日（" + DOW[dowOf(k)] + "）"; }
      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function mainOf(menu) {
        for (var i = 0; i < menu.items.length; i++) if (menu.items[i].role === "main") return menu.items[i].name;
        return menu.items[0] ? menu.items[0].name : "";
      }
      function historyOf(name) {
        var out = [];
        Object.keys(MENUS).sort().forEach(function (k) {
          MENUS[k].items.forEach(function (it) { if (it.name === name) out.push(k); });
        });
        return out;
      }
      function latestMenuKey(beforeKey) {
        var keys = Object.keys(MENUS).filter(function (k) { return k < beforeKey; }).sort();
        return keys.length ? keys[keys.length - 1] : null;
      }

      /* ===== 画面遷移 ===== */
      var app = document.getElementById("app");
      var stack = [];
      var state = { view: "home" };
      var calCursor = null; /* {y, m} */

      function go(next, push) {
        if (push !== false) stack.push(state);
        state = next;
        render();
        window.scrollTo(0, 0);
      }
      function back() {
        state = stack.length ? stack.pop() : { view: "home" };
        render();
        window.scrollTo(0, 0);
      }

      function thumbHTML(name, recipe) {
        if (recipe && recipe.img) {
          return '<div class="dish-thumb"><img src="' + recipe.img + '" alt="' + esc(name) + '" loading="lazy" />' +
            (recipe.illus ? '<span class="illus-badge">イラスト</span>' : "") + "</div>";
        }
        return '<div class="dish-thumb"><div class="noimg" aria-hidden="true">' + esc(name.charAt(0)) + "</div></div>";
      }

      function dishCardHTML(item) {
        var r = RECIPES[item.name] || null;
        var roleLabel = item.role === "main" ? "主菜" : "副菜";
        var roleClass = item.role === "main" ? "role-main" : "role-side";
        var href = RECIPE_FILES[item.name] || "#";
        return '<a class="dish-card" href="' + href + '">' +
          thumbHTML(item.name, r) +
          '<span class="dish-body"><span class="role-badge ' + roleClass + '">' + roleLabel + '</span>' +
          '<span class="dish-name">' + esc(item.name) + '</span>' +
          '<span class="dish-more">レシピを見る ›</span></span></a>';
      }

      function dishListHTML(menu) {
        var html = '<div class="dish-list">';
        menu.items.forEach(function (it) { html += dishCardHTML(it); });
        if (!menu.noodle) {
          html += '<div class="dish-card static" aria-label="ご飯"><div class="dish-thumb"><div class="noimg" aria-hidden="true">飯</div></div>' +
            '<span class="dish-body"><span class="role-badge role-rice">ご飯</span>' +
            '<span class="dish-name">ご飯</span></span></div>';
        }
        html += "</div>";
        if (menu.noodle) html += '<p class="menu-note">麺の日なので、ご飯はありません。</p>';
        if (menu.note) html += '<p class="menu-note"><strong>メモ：</strong>' + esc(menu.note) + "</p>";
        if (menu.proposal) {
          html += '<p class="menu-note"><strong>当初の提案：</strong>' + menu.proposal.map(esc).join("、") + "</p>";
        }
        return html;
      }

      /* ===== ホーム ===== */
      function renderHome() {
        var tk = todayKey();
        var p = parseKey(tk);
        if (!calCursor) calCursor = { y: p.y, m: p.m };
        var menu = MENUS[tk];
        var todaySub = menu
          ? "主菜は <strong>" + esc(mainOf(menu)) + "</strong> です"
          : "今日の分はまだ決まっていません";
        var html = "";
        html += '<p class="today-line">今日は</p>';
        html += '<p class="today-big">' + p.m + "月" + p.d + '日 <span class="dow">（' + DOW[dowOf(tk)] + "）</span></p>";
        html += '<p class="home-lead">夕ごはんの献立はこちらから見られます。</p>';
        html += '<div class="menu-cards">';
        html += '<button type="button" class="menu-card" data-action="today">' +
          '<span class="mc-head"><span class="mc-icon green"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>' +
          '<span class="mc-title">今日の献立</span></span>' +
          '<span class="mc-sub">' + todaySub + "</span>" +
          '<span class="mc-arrow">献立を見る ›</span></button>';
        html += '<button type="button" class="menu-card" data-action="month">' +
          '<span class="mc-head"><span class="mc-icon persimmon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>' +
          '<span class="mc-title">今月の献立</span></span>' +
          '<span class="mc-sub">' + p.y + "年" + p.m + '月の献立をカレンダーで見られます</span>' +
          '<span class="mc-arrow">カレンダーを開く ›</span></button>';
        html += "</div>";
        html += '<p class="snapshot-note">このページは2026年11月18日時点の献立を表示しています。11月19日（木）までの献立が入っています。</p>';
        app.innerHTML = html;
      }

      /* ===== 1日の献立 ===== */
      function renderDay(dateKey) {
        var menu = MENUS[dateKey];
        var isToday = dateKey === todayKey();
        var html = "";
        html += '<div class="topbar"><button type="button" class="back-btn" data-action="back">‹ 戻る</button><span class="spacer"></span>' +
          '<span class="day-nav"><button type="button" data-action="prev-day" aria-label="前の日">‹ 前日</button>' +
          '<button type="button" data-action="next-day" aria-label="次の日">翌日 ›</button></span></div>';
        html += '<h1 class="view-date">' + fmtDate(dateKey) + (isToday ? ' <span class="dow">今日</span>' : "") + "</h1>";
        if (menu) {
          html += '<p class="view-sub">夕ごはんの献立です。料理を押すとレシピが見られます。</p>';
          html += dishListHTML(menu);
        } else {
          html += '<p class="view-sub">夕ごはんの献立です。</p>';
          html += '<div class="empty-box"><p class="big">この日の献立はまだ決まっていません</p>' +
            "<p>決まったら、ここに表示されます。</p>" +
            '<button type="button" class="primary-btn" data-action="month">今月の献立を見る</button></div>';
          var prev = latestMenuKey(dateKey);
          if (prev) {
            html += '<h2 class="recent-head">直近の献立<span>' + fmtDate(prev) + "</span></h2>";
            html += dishListHTML(MENUS[prev]);
          }
        }
        app.innerHTML = html;
      }

      /* ===== 今月の献立（カレンダー） ===== */
      function renderMonth() {
        var y = calCursor.y, m = calCursor.m;
        var firstDow = new Date(y, m - 1, 1).getDay();
        var daysInMonth = new Date(y, m, 0).getDate();
        var tk = todayKey();
        var html = "";
        html += '<div class="topbar"><button type="button" class="back-btn" data-action="back">‹ 戻る</button></div>';
        html += '<div class="cal-head"><h1 class="cal-title">' + y + "年" + m + '月</h1>' +
          '<span class="cal-nav"><button type="button" data-action="prev-month">‹ 前月</button>' +
          '<button type="button" data-action="next-month">翌月 ›</button></span></div>';
        html += '<p class="view-sub">献立のある日を押すと、その日の料理が見られます。</p>';
        html += '<div class="cal-grid">';
        DOW.forEach(function (d, i) {
          html += '<div class="cal-dow' + (i === 0 ? " sun" : i === 6 ? " sat" : "") + '">' + d + "</div>";
        });
        for (var b = 0; b < firstDow; b++) html += '<div class="cal-cell blank"></div>';
        for (var d = 1; d <= daysInMonth; d++) {
          var k = keyOf(y, m, d);
          var menu = MENUS[k];
          var cls = "cal-cell" + (menu ? " has-menu" : "") + (k === tk ? " is-today" : "");
          var inner = '<span class="dnum">' + d + "</span>" +
            (k === tk ? '<span class="today-tag">今日</span>' : "") +
            (menu ? '<span class="dmain">' + esc(mainOf(menu)) + "</span>" : "");
          if (menu) {
            html += '<button type="button" class="' + cls + '" data-action="day" data-date="' + k + '" aria-label="' + fmtDate(k) + "の献立\">" + inner + "</button>";
          } else {
            html += '<div class="' + cls + '">' + inner + "</div>";
          }
        }
        html += "</div>";
        var monthKeys = Object.keys(MENUS).filter(function (k) { var p = parseKey(k); return p.y === y && p.m === m; }).sort();
        if (monthKeys.length) {
          html += '<h2 class="cal-list-head">' + m + "月の献立一覧</h2>";
          monthKeys.forEach(function (k) {
            var p = parseKey(k);
            html += '<button type="button" class="cal-day-row" data-action="day" data-date="' + k + '">' +
              '<span class="rdate">' + p.d + "日（" + DOW[dowOf(k)] + '）</span>' +
              '<span class="rmain">主菜：<strong>' + esc(mainOf(MENUS[k])) + "</strong></span></button>";
          });
        } else {
          html += '<p class="menu-note">この月の献立はまだありません。</p>';
        }
        app.innerHTML = html;
      }

      /* ===== レシピノート ===== */
      function renderRecipe(name) {
        var r = RECIPES[name] || {};
        var hist = historyOf(name);
        var html = "";
        html += '<div class="topbar"><button type="button" class="back-btn" data-action="back">‹ 戻る</button></div>';
        if (r.img) {
          html += '<div class="recipe-hero"><img src="' + r.img + '" alt="' + esc(name) + '" />' +
            (r.illus ? '<span class="illus-badge">イラスト</span>' : "") + "</div>";
        }
        html += '<h1 class="recipe-title">' + esc(name) + "</h1>";
        if (r.note) html += '<p class="menu-note" style="margin:0 0 18px;">' + esc(r.note) + "</p>";
        if (hist.length) {
          html += '<div class="recipe-meta"><span style="color:var(--ink-soft);font-weight:500;">作った日：</span>' +
            hist.map(function (k) {
              return '<button type="button" class="history-chip" data-action="day" data-date="' + k + '">' + fmtDate(k) + "</button>";
            }).join("") + "</div>";
        }
        if (r.ingredients && r.steps) {
          html += '<h2 class="sec-head">材料</h2><table class="ingredients"><tbody>' +
            r.ingredients.map(function (row) {
              return "<tr><td>" + esc(row[0]) + '</td><td class="amount">' + esc(row[1]) + "</td></tr>";
            }).join("") + "</tbody></table>";
          html += '<h2 class="sec-head">作り方</h2><ol class="steps">' +
            r.steps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>";
          if (r.sourceUrl) {
            html += '<p class="source-line">出典：<a href="' + r.sourceUrl + '" target="_blank" rel="noopener">' + esc(r.sourceName) + "のレシピを見る</a></p>";
          }
        } else {
          html += '<div class="pending-box">この料理の材料と作り方は、準備中です。順次追加されます。</div>';
          if (r.sourceUrl) {
            html += '<p class="source-line">出典：<a href="' + r.sourceUrl + '" target="_blank" rel="noopener">' + esc(r.sourceName) + "のレシピを見る</a></p>";
          }
        }
        app.innerHTML = html;
      }

      function render() {
        if (state.view === "home") renderHome();
        else if (state.view === "day") renderDay(state.date);
        else if (state.view === "month") renderMonth();
        else if (state.view === "recipe") renderRecipe(state.name);
      }

      app.addEventListener("click", function (ev) {
        var el = ev.target.closest("[data-action]");
        if (!el) return;
        var a = el.getAttribute("data-action");
        if (a === "back") back();
        else if (a === "today") go({ view: "day", date: todayKey() });
        else if (a === "month") {
          var p = state.view === "day" ? parseKey(state.date) : parseKey(todayKey());
          calCursor = { y: p.y, m: p.m };
          go({ view: "month" });
        } else if (a === "day") {
          var dk = el.getAttribute("data-date");
          var pp = parseKey(dk);
          calCursor = { y: pp.y, m: pp.m };
          go({ view: "day", date: dk });
        } else if (a === "recipe") go({ view: "recipe", name: el.getAttribute("data-name") });
        else if (a === "prev-day") { state = { view: "day", date: shiftKey(state.date, -1) }; render(); window.scrollTo(0, 0); }
        else if (a === "next-day") { state = { view: "day", date: shiftKey(state.date, 1) }; render(); window.scrollTo(0, 0); }
        else if (a === "prev-month") {
          calCursor = calCursor.m === 1 ? { y: calCursor.y - 1, m: 12 } : { y: calCursor.y, m: calCursor.m - 1 };
          render();
        } else if (a === "next-month") {
          calCursor = calCursor.m === 12 ? { y: calCursor.y + 1, m: 1 } : { y: calCursor.y, m: calCursor.m + 1 };
          render();
        }
      });

      (function () {
        var hm = /^#day=(\d{4}-\d{2}-\d{2})$/.exec(location.hash || "");
        if (hm && MENUS[hm[1]]) {
          var hp = parseKey(hm[1]);
          calCursor = { y: hp.y, m: hp.m };
          state = { view: "day", date: hm[1] };
        }
      })();
      render();
    </script>
  </body>
</html>
